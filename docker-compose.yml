version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: task_api_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres123}
      POSTGRES_DB: ${DATABASE_NAME:-tasks_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task_api_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_api_app
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-tasks_db}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres123}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5241
    ports:
      - "5241:5241"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task_api_network
    volumes:
      - .:/app

volumes:
  postgres_data:
    driver: local

networks:
  task_api_network:
    driver: bridge
